<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Pak News - پاکستان کی تازہ خبریں</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Nastaliq Urdu",sans-serif;background:#f5f6f8;color:#171717}.top{background:#111827;color:#fff;padding:14px 5%;display:flex;align-items:center;justify-content:space-between;gap:15px}.brand{font-size:28px;font-weight:800}.brand span{color:#ef4444}.date{font-size:14px;color:#d1d5db}.breaking{background:#dc2626;color:#fff;padding:10px 5%;font-weight:700}.nav{background:#fff;border-bottom:1px solid #ddd;padding:10px 5%;display:flex;gap:18px;overflow:auto;white-space:nowrap}.nav button{border:0;background:none;font-size:16px;cursor:pointer}.wrap{max-width:1100px;margin:20px auto;padding:0 15px}.search{display:flex;gap:8px;margin-bottom:18px}.search input{flex:1;padding:12px;border:1px solid #ccc;border-radius:8px;font-size:16px}.search button{padding:12px 18px;border:0;border-radius:8px;background:#111827;color:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}.card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 10px #00000012}.card img{width:100%;height:190px;object-fit:cover;background:#ddd}.body{padding:15px}.cat{color:#dc2626;font-size:13px;font-weight:700}.title{font-size:21px;line-height:1.55;margin:7px 0;font-weight:700}.meta{font-size:12px;color:#777}.empty{text-align:center;background:#fff;padding:40px;border-radius:12px}.admin{display:inline-block;margin-top:25px;padding:11px 16px;background:#111827;color:#fff;text-decoration:none;border-radius:8px}@media(max-width:600px){.brand{font-size:23px}.top{align-items:flex-start;flex-direction:column}.card img{height:180px}}
</style>
</head>
<body>
<header class="top"><div class="brand">Pak <span>News</span></div><div class="date" id="date"></div></header>
<div class="breaking">🔴 بریکنگ نیوز: <span id="breakingText">تازہ خبریں یہاں دکھائی جائیں گی</span></div>
<nav class="nav"><button onclick="loadNews('all')">تمام</button><button onclick="loadNews('Pakistan')">پاکستان</button><button onclick="loadNews('Khyber Pakhtunkhwa')">خیبر پختونخوا</button><button onclick="loadNews('World')">دنیا</button><button onclick="loadNews('Sports')">کھیل</button><button onclick="loadNews('Business')">کاروبار</button><button onclick="loadNews('Technology')">ٹیکنالوجی</button></nav>
<main class="wrap"><div class="search"><input id="search" placeholder="خبر تلاش کریں..." oninput="render()"><button onclick="render()">تلاش</button></div><div id="news" class="grid"><div class="empty">خبریں لوڈ ہو رہی ہیں...</div></div><a class="admin" href="admin.html">🔐 Admin Panel</a></main>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig={apiKey:"AIzaSyAAUGwOWg5cTnRZPSYVspnDNqqDa_Ri4Lo",authDomain:"pak-news-31b1c.firebaseapp.com",projectId:"pak-news-31b1c",storageBucket:"pak-news-31b1c.firebasestorage.app",messagingSenderId:"5107439443",appId:"1:5107439443:web:3c78ccdeee2eaf11f6b3a6"};
firebase.initializeApp(firebaseConfig);const db=firebase.firestore();let allNews=[];let category='all';
document.getElementById('date').textContent=new Date().toLocaleDateString('ur-PK',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function loadNews(cat='all'){category=cat;document.getElementById('news').innerHTML='<div class="empty">خبریں لوڈ ہو رہی ہیں...</div>';try{const snap=await db.collection('news').get();allNews=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>{const ad=a.createdAt?.toDate?a.createdAt.toDate():new Date(a.createdAt||0);const bd=b.createdAt?.toDate?b.createdAt.toDate():new Date(b.createdAt||0);return bd-ad});render()}catch(e){document.getElementById('news').innerHTML='<div class="empty">خبریں لوڈ نہیں ہو سکیں۔ Firebase rules اور database چیک کریں۔</div>';console.error(e)}}
function render(){let q=document.getElementById('search').value.trim().toLowerCase();let list=allNews.filter(n=>(category==='all'||n.category===category)&&(!q||String(n.title||'').toLowerCase().includes(q)||String(n.description||n.content||'').toLowerCase().includes(q)));document.getElementById('breakingText').textContent=list[0]?.title||allNews[0]?.title||'تازہ خبریں یہاں دکھائی جائیں گی';if(!list.length){document.getElementById('news').innerHTML='<div class="empty">اس وقت کوئی خبر موجود نہیں۔</div>';return}document.getElementById('news').innerHTML=list.map(n=>`<article class="card">${n.imageUrl?`<img src="${esc(n.imageUrl)}" alt="">`:''}<div class="body"><div class="cat">${esc(n.category||'خبر')}</div><div class="title">${esc(n.title)}</div><div class="meta">${n.createdAt?.toDate?n.createdAt.toDate().toLocaleString('ur-PK'):esc(n.date||'')}</div>${n.description||n.content?`<p>${esc(n.description||n.content).slice(0,220)}</p>`:''}</div></article>`).join('')}
loadNews();
</script>
</body></html>
